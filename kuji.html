<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人生新出単語</title>
    
    <link rel="icon" type="image/png" href="./assets/icon.png?v=6">
    <link rel="apple-touch-icon" href="./assets/icon.png?v=6">

    <link rel="stylesheet" href="./assets/main.css?v=15">
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js" defer></script>
    <script src="./assets/main.js?v=15" defer></script>
</head>
<body>
    <div class="app-wrapper">
        <!-- ヘッダー -->
        <header class="app-header">
            <div class="header-content">
                <div class="header-text">
                    <h1 class="app-title">人生新出単語</h1>
                </div>
            </div>
            <div class="header-actions">
                <div id="auth-bar" class="auth-bar">
                    <span id="sync-status" class="sync-status">未同期</span>
                    <button type="button" id="auth-btn" class="btn-auth" onclick="handleAuthClick()">Google同期</button>
                </div>
                <a href="./edit.html" class="btn btn-nav">単語を登録・編集</a>
            </div>
        </header>

        <!-- ランダムくじ引き -->
        <section class="card draw-section">
            <div class="draw-row">
                <span class="sub-title">ランダムピックアップ</span>
                <button id="draw-btn" class="btn btn-primary btn-draw-compact" onclick="drawWord()">
                    引く
                </button>
            </div>
            
            <div id="draw-result" class="draw-result-box" style="display: none;" aria-live="polite">
                <div id="result-word" class="result-word"></div>
                <div id="result-meaning" class="result-meaning"></div>
            </div>
        </section>

        <!-- 単語一覧・検索 -->
        <section class="card list-card">
            <div class="list-header">
                <div class="list-title-wrap">
                    <h2 class="card-title">登録単語</h2>
                    <span id="filtered-count" class="count-badge">0 件</span>
                </div>
            </div>

            <!-- 検索バー -->
            <div class="search-box">
                <input type="text" id="search-input" placeholder="検索..." oninput="handleSearch()">
            </div>

            <!-- 単語カード一覧コンテナ -->
            <div id="word-list" class="word-list" role="list">
            </div>
        </section>
    </div>
</body>
</html>
