<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>単語の登録・編集 - 人生新出単語</title>
    
    <link rel="icon" href="./icon.jpg">
    <link rel="apple-touch-icon" href="./icon.jpg">

    <link rel="stylesheet" href="./sanitize.css">
    <link rel="stylesheet" href="./main.css?v=11">
    <script src="./main.js?v=11" defer></script>
</head>
<body>
    <div class="app-wrapper">
        <!-- ナビゲーションヘッダー -->
        <header class="app-header header-edit-page">
            <a href="./kuji.html" class="btn-back">
                ← 単語一覧に戻る
            </a>
            <h1 class="app-title">📝 単語の一括登録・編集</h1>
            <p class="app-subtitle">単語を改行区切りでまとめて入力・編集できます</p>
        </header>

        <!-- 登録・編集カード -->
        <section class="card editor-card">
            <div class="editor-header">
                <span class="editor-badge">入力エリア</span>
                <span id="word-count" class="count-badge">0 件</span>
            </div>
            
            <p class="editor-guide">
                <strong>1行に1単語ずつ</strong> 改行して入力してください（コピペもOK！）。<br>
                意味も登録したい場合は <code>単語 : 意味</code> のようにコロンで区切ってください。<br>
                <span class="guide-note">※ 単語だけでも登録できます。入力した内容は自動保存されます。</span>
            </p>

            <div class="textarea-wrapper">
                <textarea id="bulk-input" rows="10" placeholder="単語を改行区切りで入力...&#10;例:&#10;大吉 : 最高の運勢&#10;中吉&#10;小吉&#10;リンゴ : 赤い果物" oninput="handleBulkInput()"></textarea>
            </div>

            <div class="editor-page-actions">
                <a href="./kuji.html" class="btn btn-primary btn-save-return">
                    ✓ 保存して一覧に戻る
                </a>
                <div class="editor-sub-btns">
                    <button type="button" class="btn btn-sub" onclick="resetDefaultWords()">初期データに戻す</button>
                    <button type="button" class="btn btn-sub" onclick="clearAllWords()">すべてクリア</button>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
