<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>単語の登録・編集 - 人生新出単語</title>
    
    <link rel="icon" type="image/png" href="./assets/icon.png?v=6">
    <link rel="apple-touch-icon" href="./assets/icon.png?v=6">

    <link rel="stylesheet" href="./assets/main.css?v=29">
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js" defer></script>
    <script src="./assets/main.js?v=29" defer></script>
</head>
<body>
    <div class="app-wrapper">
        <!-- 未ログイン時の専用ゲート画面（ログイン必須） -->
        <section id="login-gate" class="card login-gate-card">
            <img src="./assets/icon.png?v=6" alt="人生新出単語アイコン" class="gate-icon">
            <h1 class="gate-title">人生新出単語</h1>
            <p id="gate-message" class="gate-desc">ログイン状態を確認しています...</p>
            <button type="button" id="gate-login-btn" class="btn btn-primary btn-gate-login" onclick="handleAuthClick()" style="display: none;">
                Googleでログインして始める
            </button>
        </section>

        <!-- ログイン後に表示されるメイン画面 -->
        <div id="app-main" class="app-main" style="display: none;">
            <!-- ヘッダー -->
            <header class="app-header">
                <div class="header-content">
                    <div class="header-text">
                        <h1 class="app-title">単語を登録・編集</h1>
                    </div>
                </div>
                <div class="header-actions">
                    <div id="auth-bar" class="auth-bar">
                        <span id="sync-status" class="sync-status">同期中</span>
                        <button type="button" id="auth-btn" class="btn-auth" onclick="handleAuthClick()">ログアウト</button>
                    </div>
                    <a href="./index.html" class="btn btn-nav" onclick="returnToIndex(event)">
                        <svg class="icon-line" viewBox="0 0 16 16" aria-hidden="true"><path d="M12.5 8H3.5M7 4.5L3.5 8 7 11.5"/></svg>
                        一覧に戻る
                    </a>
                </div>
            </header>

            <!-- 本棚（どの本のシートを編集するか選択） -->
            <section class="card book-shelf-card">
                <div class="book-shelf-top">
                    <span class="sub-title">
                        <svg class="icon-line icon-subtle" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 3.5h4.2c1 0 1.3.4 1.3 1.2v8.3c0-.6-.5-1-1.3-1H2.5V3.5zm11 0H9.3c-1 0-1.3.4-1.3 1.2v8.3c0-.6.5-1 1.3-1h4.2V3.5z"/></svg>
                        登録・編集する本を選択
                    </span>
                    <button type="button" class="btn-isbn-toggle" onclick="toggleIsbnPanel()">＋ 本(ISBN)を追加</button>
                </div>

                <div id="isbn-panel" class="isbn-panel" style="display: none;">
                    <div class="isbn-input-row">
                        <input type="text" id="isbn-input" placeholder="ISBN（例: 9784101010014）または書名" onkeydown="handleIsbnKey(event)">
                        <button type="button" id="isbn-submit-btn" class="btn-quick-add" onclick="addBookByIsbn()">追加</button>
                    </div>
                    <div id="isbn-status" class="isbn-status">ISBNコードを入れると書名・著者を自動取得します（書名の直接入力も可）</div>
                </div>

                <div id="book-tabs" class="book-tabs" role="tablist" aria-label="編集する書籍の切り替え"></div>
                <div id="active-book-meta" class="active-book-meta" style="display: none;"></div>
            </section>

            <!-- 登録・編集カード -->
            <section class="card editor-card">
                <!-- スクロール不要で複数単語もまとめてリスト最下部に追加できる入力欄 -->
                <div class="quick-add-box">
                    <div class="quick-add-header">
                        <span class="editor-guide">新規追加（意味省略時は辞書から自動取得を試みます）</span>
                        <button type="button" class="btn-quick-add" onclick="addQuickWord()">追加して保存</button>
                    </div>
                    <textarea id="quick-add-input" rows="3" placeholder="新しい単語を入力（改行で複数一気に追加できます&#10;単語だけで入力すると辞書から意味を自動取得します）"></textarea>
                </div>

                <div class="editor-header">
                    <span id="editor-sheet-title" class="editor-guide">このシートのテキスト編集（<code>単語 : 意味</code>）</span>
                    <div class="editor-header-right">
                        <button type="button" id="batch-dict-btn" class="btn-jump-bottom" onclick="batchFetchMissingMeanings()">辞書から意味を一括補完</button>
                        <button type="button" class="btn-jump-bottom" onclick="jumpToBulkBottom()">↓ 最下部へ</button>
                        <span id="word-count" class="count-badge">0 件</span>
                    </div>
                </div>

                <div class="textarea-wrapper">
                    <textarea id="bulk-input" rows="12" placeholder="単語を改行区切りで入力..." oninput="handleBulkInput()"></textarea>
                </div>

                <div class="editor-page-actions">
                    <div class="save-action-group">
                        <button type="button" id="save-btn" class="btn-save-explicit" onclick="saveEditorExplicit()">保存する</button>
                        <span id="save-feedback" class="save-feedback" aria-live="polite"></span>
                    </div>
                    <div class="editor-sub-btns">
                        <button type="button" class="btn btn-sub" onclick="clearAllWords()">このシートを全消去</button>
                    </div>
                </div>
            </section>
        </div>
    </div>
</body>
</html>
